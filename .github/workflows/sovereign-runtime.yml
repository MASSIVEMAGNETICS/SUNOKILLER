name: Sovereign Runtime Boundary

on:
  pull_request:
    branches: [main]
    paths:
      - "src/sunokiller/runtime/**"
      - "src/sunokiller/omen.py"
      - "tests/test_sovereign_runtime.py"
      - "setup.py"
      - ".github/workflows/sovereign-runtime.yml"
  push:
    branches: [main]
    paths:
      - "src/sunokiller/runtime/**"
      - "src/sunokiller/omen.py"
      - "tests/test_sovereign_runtime.py"
      - "setup.py"
      - ".github/workflows/sovereign-runtime.yml"

permissions:
  contents: read

jobs:
  security-contract:
    name: security-contract (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package without unrelated model dependencies
        run: python -m pip install --no-deps -e .

      - name: Compile runtime
        run: python -m compileall -q src/sunokiller/runtime src/sunokiller/omen.py tests/test_sovereign_runtime.py

      - name: Run sovereign runtime security contracts
        run: python -m unittest -v tests.test_sovereign_runtime
